<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription à un atelier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="bg-light">

    <div class="container d-flex flex-column justify-content-center align-items-center min-vh-100 py-4">
        <div class="w-100 rounded-3 shadow-lg overflow-hidden">
            <div class="bg-primary text-white p-4">
                <p>ATELIERS DE DÉVELOPPEMENT WEB - UN-CHK</p>
                <h1 class="h3">Inscription à un atelier</h1>
                <p class="mb-0">Choisissez votre atelier et votre mode de participation.</p>
            </div>

            <div class="bg-white p-4">
                <p class="text-muted">Les champs marqués d’un * sont obligatoires.</p>
                <form>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="prenom" class="form-label">Prénom *</label>
                            <input type="text" id="prenom" name="prenom" class="form-control" placeholder="Ex. Aissatou"
                                required>
                        </div>
                        <div class="col-md-6">
                            <label for="nom" class="form-label">Nom *</label>
                            <input type="text" id="nom" name="nom" class="form-control" placeholder="Ex. Diallo"
                                required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Adresse Email *</label>
                        <input type="email" id="email" name="email" class="form-control"
                            placeholder="Ex. aissatou.diallo@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="atelier" class="form-label">Choisissez un atelier *</label>
                        <select id="atelier" name="atelier" class="form-select" required>
                            <option value="">Choisissez un atelier --</option>
                            <option value="atelier1">Atelier 1</option>
                            <option value="atelier2">Atelier 2</option>
                            <option value="atelier3">Atelier 3</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <p class="form-label fs-6">Mode de participation *</p>
                        <div class="d-flex gap-3">
                            <div class="form-check">
                                <input type="radio" id="en-personne" name="mode" value="en-personne"
                                    class="form-check-input" required>
                                <label for="en-personne" class="form-check-label">Présentiel</label>
                            </div>
                            <div class="form-check">
                                <input type="radio" id="en-ligne" name="mode" value="en-ligne" class="form-check-input"
                                    required>
                                <label for="en-ligne" class="form-check-label">À distance</label>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Vos attentes <span
                                class="text-muted">(Facultatif)</span></label>
                        <textarea id="message" name="message" class="form-control" rows="4"
                            placeholder="Que souhaitez-vous apprendre pendant cet atelier ?"></textarea>
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" id="fieldCheck" name="reglement" value="accepte" class="form-check-input"
                            required>
                        <label for="fieldCheck" class="form-check-label">J’accepte le règlement de l’atelier. *</label>
                    </div>
                    <hr>
                    <div>
                        <button type="submit" class="btn btn-primary">S'inscrire</button>
                        <button type="reset" class="btn btn-secondary">Réinitialiser</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
